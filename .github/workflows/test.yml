name: 測試

on:
  push:
    paths: ["etl/**", "tests/**", "requirements*.txt", ".github/workflows/test.yml"]
  pull_request:
    paths: ["etl/**", "tests/**", "requirements*.txt"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
