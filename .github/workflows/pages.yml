name: 部署前端

on:
  # 直接推 main 時（改前端、手動改資料）重新部署
  push:
    branches: [main]
    paths: ["web/**", "data/**", ".github/workflows/pages.yml"]

  # 每日 ETL 之後接著部署。
  # 不能只靠上面的 push 觸發——ETL 是用預設的 GITHUB_TOKEN 推送的，
  # GitHub 為避免遞迴，刻意不讓這種 push 產生 workflow 事件。
  # workflow_run 是接在另一個 workflow「完成」之後，不受此限制。
  workflow_run:
    workflows: ["每日 ETL"]
    types: [completed]

  workflow_dispatch:

# 同時只跑一份部署，排隊而不取消，避免部署到舊資料
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # ETL 失敗時不要拿半份資料去部署
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 事件的 github.sha 是「ETL 開始時」的 commit，
          # 不含它剛推上去的資料。取分支名才拿得到含新資料的最新狀態。
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: 組裝靜態站台
        run: |
          mkdir -p _site
          cp -r web/. _site/
          # data/ 要跟 index.html 同層，前端才會優先讀到它而不是退回示範資料
          if [ -d data ]; then
            cp -r data _site/data
            echo "已納入 data/：$(ls data | tr '\n' ' ')"
          else
            echo "::warning::還沒有 data/，站台將顯示示範資料。請先跑一次「每日 ETL」。"
          fi
          # Pages 預設會走 Jekyll，跳過它以免底線開頭的檔案被忽略
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
